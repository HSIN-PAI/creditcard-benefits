<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 1.6em;
        }

        .subtitle {
            text-align: center;
            color: #4b5563;
            font-size: 0.9em;
            margin-bottom: 25px;
            background: #e5e7eb;
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            position: relative;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
        }

        .search-box {
            width: 100%;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .card-list {
            display: grid;
            gap: 15px;
        }

        /* --- 卡片樣式 --- */
        .credit-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-left: 6px solid var(--primary-color);
            transition: transform 0.2s;
            cursor: pointer;
            position: relative;
            padding-bottom: 40px;
        }

        .credit-card:active {
            transform: scale(0.98);
        }

        .click-hint {
            position: absolute;
            bottom: 15px;
            right: 15px;
            font-size: 13px;
            color: #2563eb;
            display: flex;
            align-items: center;
            font-weight: 600;
            background: #eff6ff;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .card-name {
            font-weight: bold;
            font-size: 1.2em;
            color: #111827;
            padding-right: 10px;
            line-height: 1.3;
        }

        .reward-rate {
            background-color: #eff6ff;
            color: #1d4ed8;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95em;
            white-space: nowrap;
        }

        .merchant-tag {
            display: inline-block;
            background-color: #f3f4f6;
            color: #4b5563;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            margin-right: 5px;
            margin-bottom: 5px;
        }

        .note {
            font-size: 0.9em;
            color: #6b7280;
            margin-top: 10px;
            border-top: 1px dashed #e5e7eb;
            padding-top: 8px;
            line-height: 1.5;
        }

        /* --- Modal 視窗 --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            padding: 25px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #f3f4f6;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .modal-title {
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--primary-color);
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 15px;
            padding-right: 40px;
        }

        .detail-body {
            line-height: 1.6;
            color: #374151;
        }
        
        .section-box {
            margin-bottom: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            background: #fff;
        }

        .section-title {
            display: flex;
            align-items: center;
            font-weight: bold;
            color: #1f2937;
            background: #f9fafb;
            margin: -15px -15px 10px -15px;
            padding: 10px 15px;
            border-bottom: 1px solid #e5e7eb;
            border-radius: 8px 8px 0 0;
            font-size: 1.05em;
        }

        .section-title span {
            background: #dbeafe;
            color: #1e40af;
            font-size: 0.8em;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: auto;
        }

        .detail-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .detail-list li {
            margin-bottom: 8px;
            position: relative;
            padding-left: 15px;
        }

        .detail-list li::before {
            content: "•";
            color: var(--primary-color);
            position: absolute;
            left: 0;
            font-weight: bold;
        }

        .category-label {
            font-weight: bold;
            color: #4b5563;
            background: #f3f4f6;
            padding: 0 4px;
            border-radius: 4px;
        }

        .warning-box {
            background: #fffbeb;
            border: 1px solid #fcd34d;
            color: #92400e;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95em;
        }

        .highlight {
            color: #dc2626;
            font-weight: bold;
        }

    </style>
</head>

                    <div class="section-title" style="background: #fffbeb;">💰 封頂試算 (依等級)</div>
                    <ul class="detail-list">
                        <li><b>大戶Plus (30萬資產)</b>：<br>👉 指定通路 <span class="highlight">刷 NT$ 25,000 封頂</span>。<br>(國內最高 5% / 國外 6%)</li>
                        <li><b>大戶 (10萬資產)</b>：<br>👉 指定通路 <span class="highlight">刷 NT$ 16,000 封頂</span>。<br>(國內最高 3.5% / 國外 4.5%)</li>
                    </ul>
                </div>

                <div class="section-box">
                    <div class="section-title">七大指定通路 <span>(等級加碼)</span></div>
                    <ul class="detail-list">
                        <li><span class="category-label">樂</span> 旅行社、航空、飯店、Netflix、PlayStation、XBOX。</li>
                        <li><span class="category-label">食</span> foodpanda、Uber Eats。</li>
                        <li><span class="category-label">行</span> 電影院、兩廳院購票。</li>
                    </ul>
                </div>
            `
        },
        {
            bank: "永豐銀行",
            name: "幣倍卡",
            merchants: ["海外", "亞馬遜", "日韓泰越"],
            rate: "最高 6%",
            note: "門檻：外幣資產等值台幣 10 萬 (超匯)。國外基礎 2%。",
            details: `
                <div class="warning-box">
                    <b>⚠️ 門檻：</b>需為「超匯等級」(外幣資產達 10 萬)。
                </div>

                <div class="section-box" style="border-color: #fcd34d; background: #fffdf0;">
                    <div class="section-title" style="background: #fffbeb;">💰 封頂試算</div>
                    <ul class="detail-list">
                        <li><b>精選通路 (6%)</b>：加碼 4% 上限 300 元。<br>👉 <span class="highlight">刷 NT$ 7,500 封頂</span>。</li>
                        <li><b>國外一般消費 (2%)</b>：<span class="highlight">無上限</span>。</li>
                    </ul>
                </div>

                <div class="section-box">
                    <div class="section-title">回饋細節</div>
                    <ul class="detail-list">
                        <li><span class="category-label">精選通路 6%</span> 海外實體商店、Amazon、iHerb。<br><i>(計算：國外 2% + 精選加碼 4% = 6%)</i></li>
                        <li><span class="category-label">一般消費</span> 國外 2% 無上限 (需超匯等級)。</li>
                    </ul>
                </div>
            `
        }
    ];

    // ==========================================
    // 程式邏輯區
    // ==========================================
    const cardListEl = document.getElementById('cardList');
    const searchInput = document.getElementById('searchInput');
    const emptyState = document.getElementById('emptyState');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');

    function renderCards(filterText = '') {
        cardListEl.innerHTML = '';
        const searchStr = filterText.toLowerCase();

        const filteredData = myCards.filter(card => {
            const contentToSearch = [
                card.name, 
                card.bank, 
                ...card.merchants, 
                card.note,
                card.details || '' 
            ].join(' ').toLowerCase();
            return contentToSearch.includes(searchStr);
        });

        if (filteredData.length === 0) {
            emptyState.style.display = 'block';
        } else {
            emptyState.style.display = 'none';
        }

        filteredData.forEach(card => {
            const div = document.createElement('div');
            div.className = 'credit-card';
            div.onclick = () => openModal(card);

            const merchantsHtml = card.merchants.map(m => `<span class="merchant-tag">#${m}</span>`).join('');
            
            div.innerHTML = `
                <div class="card-header">
                    <div class="card-name">${card.bank} ${card.name}</div>
                    <div class="reward-rate">${card.rate}</div>
                </div>
                <div>${merchantsHtml}</div>
                <div class="note">${card.note}</div>
                <div class="click-hint">點擊查看封頂試算與詳細通路 💰</div>
            `;
            
            cardListEl.appendChild(div);
        });
    }

    function openModal(cardData) {
        modalTitle.innerText = `${cardData.bank} ${cardData.name}`;
        modalBody.innerHTML = cardData.details || '<p>無詳細資訊</p>';
        modalOverlay.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        modalOverlay.style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeModal();
    });

    searchInput.addEventListener('input', (e) => {
        renderCards(e.target.value);
    });

    renderCards();
</script>

</body>
</html>
